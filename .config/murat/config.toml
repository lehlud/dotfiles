# murat: standalone JMAP-only TUI mail user agent

[ui]
split = "vertical" # vertical = top/bottom, horizontal = side-by-side
page_size = 50
editor = "" # empty = $EDITOR, then vi

[theme]
header = "reverse"
selected = "reverse"
unread = "bold"
status = "reverse"
error = "bold"

[keys]
quit = "q"
force_quit = "Q"
sync = "s"
compose = "c"
filter = "f"
actions = "space"
open = "enter"
next = "j"
prev = "k"
down = "down"
up = "up"
page_down = "pagedown"
page_up = "pageup"
top = "g"
bottom = "G"
cycle_account = "a"

[crypto]
gpg_recipient = "0A12120F017001CDABDFDC468874D17B49BF1763"

[pgp]
enabled = true
sign = false
encrypt = false
encrypt_to_self = true
attach_public_key = false
public_key = ""
