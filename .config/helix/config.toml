theme = "custom"

[editor]
line-number = "relative"
whitespace.render = "all"
soft-wrap.enable = true
soft-wrap.max-wrap = 100
# lsp.display-inlay-hints = true
lsp.inlay-hints-length-limit = 20

end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal.space]
f = "file_picker_in_current_directory"
F = "file_picker"

W = ":w"
q = ":q"
Q = ":qa!"
x = ":wq"

B = ':sh hx-git-blame %{cursor_line} "%{buffer_name}"'

m = ':vs %sh{hx-man-file "%{selection}"}'

[keys.insert]
v = { v = "normal_mode" }
