font_size               15

font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

window_margin_width     0

tab_bar_style powerline

shell /bin/sh -lc 'exec "$HOME/.local/bin/termemu-lubox-shell"'

map ctrl+shift+t new_tab_with_cwd

env TERMINAL=kitty

include colors.conf
